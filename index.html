<!DOCTYPE html>
<html lang="en" x-data="labelApp()" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gridfinity Label Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs" defer></script>
  <!-- Iconify is bundled via src/icons.js -->
</head>
<body class="bg-gray-50 font-sans flex flex-col items-center p-6">
  <h1 class="text-2xl font-bold mb-1">Gridfinity Label Generator</h1>
  <p class="text-gray-500 mb-6">Print-Ready Labels for Your Gridfinity System</p>

  <div class="bg-white shadow rounded-xl p-6 w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Left form -->
    <div class="md:col-span-2 space-y-4">
      <!-- Tabs and system -->
      <div class="flex flex-wrap gap-2">
        <button @click="tab='screw'" :class="tab==='screw'?'bg-blue-600 text-white':'bg-gray-100'" class="px-4 py-2 rounded-lg text-sm font-medium">Screw</button>
        <button @click="tab='nut'" :class="tab==='nut'?'bg-blue-600 text-white':'bg-gray-100'" class="px-4 py-2 rounded-lg text-sm font-medium">Nut</button>
        <button @click="tab='washer'" :class="tab==='washer'?'bg-blue-600 text-white':'bg-gray-100'" class="px-4 py-2 rounded-lg text-sm font-medium">Washer</button>
        <button @click="system='metric'" :class="system==='metric'?'bg-blue-600 text-white':'bg-gray-100'" class="px-4 py-2 rounded-lg text-sm font-medium">Metric</button>
        <button @click="system='imperial'" :class="system==='imperial'?'bg-blue-600 text-white':'bg-gray-100'" class="px-4 py-2 rounded-lg text-sm font-medium">Imperial</button>
      </div>

      <!-- Screw Type -->
      <label class="block text-sm font-medium">Screw Type
        <select x-model="screwType" class="w-full mt-1 border rounded-lg p-2 text-sm">
          <option value="bolt">Bolt</option>
          <option value="machine">Machine</option>
          <option value="wood">Wood</option>
        </select>
      </label>

      <!-- Head Type -->
      <label class="block text-sm font-medium">Head Type
        <select x-model="headType" @change="standard = headStandards[headType]" class="w-full mt-1 border rounded-lg p-2 text-sm">
          <template x-for="(label, key) in headOptions" :key="key">
            <option :value="key" x-text="label"></option>
          </template>
        </select>
      </label>

      <!-- Size and Length -->
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-sm font-medium">Size
          <select x-model="thread" class="w-full mt-1 border rounded-lg p-2 text-sm">
            <template x-for="s in sizes" :key="s">
              <option x-text="s"></option>
            </template>
          </select>
        </label>
        <label class="block text-sm font-medium">Length
          <select x-model="length" class="w-full mt-1 border rounded-lg p-2 text-sm">
            <template x-for="l in lengths" :key="l">
              <option x-text="l"></option>
            </template>
          </select>
        </label>
      </div>

      <!-- Standard -->
      <label class="block text-sm font-medium">Standard
        <input type="text" x-model="standard" placeholder="DIN / ISO" class="w-full mt-1 border rounded-lg p-2 text-sm" />
      </label>

      <!-- Preview -->
      <div class="border border-dashed rounded-lg h-24 flex flex-col justify-center items-center text-gray-400 text-sm bg-white">
        <template x-if="canDownload">
          <div x-html="svgContent()"></div>
        </template>
        <template x-if="!canDownload">
          <span>Fill out the form to generate a label</span>
        </template>
      </div>

      <!-- Download & Coffee -->
      <div class="flex space-x-2">
        <button @click="download" :disabled="!canDownload" :class="canDownload?'bg-blue-600 text-white':'bg-gray-100 text-gray-400'" class="flex-1 rounded-lg px-4 py-2 text-sm">Download</button>
        <a href="https://www.buymeacoffee.com/" target="_blank" class="flex-1 bg-yellow-400 rounded-lg px-4 py-2 text-sm font-semibold text-center">☕ Buy me a coffee</a>
      </div>
    </div>

    <!-- Right settings -->
    <div class="space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-sm">Standard Reference</span>
        <input type="checkbox" x-model="standardRef" class="h-5 w-5 text-blue-600 rounded" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm">Image</span>
        <input type="checkbox" x-model="image" class="h-5 w-5 text-blue-600 rounded" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm">QR Code</span>
        <input type="checkbox" x-model="qrCode" class="h-5 w-5 text-blue-600 rounded" />
      </div>

      <div>
        <label class="text-sm font-medium">Label Width (<span x-text="labelWidth"></span> mm)</label>
        <input type="range" min="37" max="100" x-model="labelWidth" class="w-full" />
      </div>

      <div>
        <span class="text-sm font-medium mb-1 block">Label Height</span>
        <div class="grid grid-cols-4 gap-2">
          <template x-for="h in [9,12,18,24]" :key="h">
            <button @click="labelHeight=h" :class="labelHeight===h?'bg-blue-600 text-white':'bg-gray-100'" class="px-2 py-1 rounded-lg text-sm">
              <span x-text="h"></span> mm
            </button>
          </template>
        </div>
      </div>

      <button class="w-full bg-gray-100 rounded-lg px-4 py-2 text-sm">Provide feedback</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
